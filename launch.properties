# ==========================================
# tp-net-host-launch Configuration
# ==========================================

# --- Launch ---
launch.runtime.delay=1000

# --- Update ---
update.repo.url=https://github.com/tungttsmd/tp-net-host-release/archive/refs/heads/staging.zip
update.staging.timeout=600
update.backup.maxCount=2

# --- Staging ---
staging.console.debug=false

# --- Watchdog ---
watchdog.maxRestarts=5
watchdog.restartDelay=1000
watchdog.waitForProcessExitcode=2000
watchdog.launchDelay=5000

# --- Managed Processes ---
processes.0.name=tp-net-host-cloudflared-service
processes.0.cmd=current\\tp-net-host-cloudflared-service\\run.bat

processes.1.name=tp-net-host-mosquitto-environment
processes.1.cmd=current\\tp-net-host-mosquitto-environment\\run.bat

processes.2.name=tp-net-host-redis-environment
processes.2.cmd=current\\tp-net-host-redis-environment\\run.bat

processes.3.name=tp-net-watcher
processes.3.cmd=current\\tp-net-watcher\\run.bat

# Thêm process cứ viết processes.3.name và processes.3.cmd (nơi chỉ định tên và lệnh để chạy) .... tương tự